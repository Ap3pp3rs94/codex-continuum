name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: release_tag
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
              $tag = $env:GITHUB_REF_NAME
          }
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag must look like v0.1.1. Got '$tag'."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate.ps1

      - name: Build plugin zip
        shell: powershell
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $version = $tag.TrimStart("v")
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package-plugin.ps1 -Version $version -Force

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_tag.outputs.tag }}"
          $assets = Get-ChildItem -LiteralPath .\dist -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assets --clobber
          }
          else {
              gh release create $tag @assets --title "Codex Continuum $tag" --generate-notes
          }
